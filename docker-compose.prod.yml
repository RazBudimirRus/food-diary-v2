# Production docker-compose для сервера с внешним nginx.
# Актуальные адрес сервера и порядок обновления — в DEPLOY.md.
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
# Nginx проксирует на 127.0.0.1:5000
# Phase 26.3: см. nginx.conf в корне репозитория — эталонный конфиг внешнего
# nginx (server_tokens off, TLS, проксирование на 127.0.0.1:5000). Файл нужно
# скопировать на хост (/etc/nginx/sites-available/) — он не собирается в образ.

# BUG-08: сервис clamav удалён. FreshClam не мог обновлять базы (Cisco/Talos CDN
# блокирует IP-диапазон VK Cloud), из-за чего clamd не поднимался, сокет не
# создавался и контейнер месяцами висел unhealthy. Скан при этом всё равно не
# выполнялся (fail-open в scanForViruses), но каждая проверка /api/health писала
# ошибку в лог — ~2900 строк в сутки.
#
# Компенсирующая мера: uploadPhoto() в server/s3.ts перекодирует любое изображение
# через sharp в WebP, что уничтожает вложенные payload'ы в метаданных.
#
# Как вернуть антивирус: восстановить сервис clamav и volume clamav_sock из
# истории git, вернуть api.environment.CLAMAV_SOCKET и монтирование сокета.
# Код в s3.ts менять не нужно — scanForViruses() сам включается при заданном
# CLAMAV_SOCKET и пропускает скан, когда переменная пуста.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: food_diary_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
    volumes:
      - data_db:/app/data
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - food_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  food_net:
    driver: bridge

volumes:
  data_db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/foodbot/data
