# Production docker-compose для сервера с внешним nginx (95.163.213.45)
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
# Nginx проксирует на 127.0.0.1:5000
# Phase 26.3: см. nginx.conf в корне репозитория — эталонный конфиг внешнего
# nginx (server_tokens off, TLS, проксирование на 127.0.0.1:5000). Файл нужно
# скопировать на хост (/etc/nginx/sites-available/) — он не собирается в образ.

version: "3.9"

services:
  clamav:
    image: clamav/clamav:1.4
    container_name: food_diary_clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
      - clamav_sock:/var/run/clamav
    networks:
      - food_net
    healthcheck:
      # clamav/clamav:1.4 ships clamdcheck at /usr/local/bin/clamdcheck
      # It checks the Unix socket at /var/run/clamav/clamd.sock
      test: ["CMD", "sh", "-c", "echo PING | nc -q1 -U /var/run/clamav/clamd.sock | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      # First run: freshclam must finish downloading virus databases (~300 MB)
      start_period: 300s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: food_diary_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      # Phase 28.4: ClamAV socket path (shared volume with clamav service)
      CLAMAV_SOCKET: /var/run/clamav/clamd.sock
    volumes:
      - data_db:/app/data
      - clamav_sock:/var/run/clamav:ro
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - food_net
    depends_on:
      clamav:
        # service_started: API не блокируется на ClamAV healthcheck.
        # ClamAV при первом запуске скачивает ~300MB баз — это занимает минуты.
        # Код в s3.ts уже graceful: если сокет недоступен — скан пропускается.
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  food_net:
    driver: bridge

volumes:
  data_db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/foodbot/data
  clamav_db:
  clamav_sock:
