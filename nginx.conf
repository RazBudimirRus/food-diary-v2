# nginx.conf — Production config for fooddiary.razbudimir.com
# Phase 26.3: server_tokens off, CORS restricted

server {
    listen 80;
    server_name fooddiary.razbudimir.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fooddiary.razbudimir.com;

    ssl_certificate     /etc/letsencrypt/live/razbudimir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/razbudimir.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Phase 26.3: hide nginx version
    server_tokens off;

    # Proxy to Docker app
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
